global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

# 세 경로를 pipeline 레이블 하나로 가른다. 대시보드의 모든 비교 쿼리는 이 레이블로 묶는다.
#   isl-kafka  : Agent → Engine → EES Kafka Provider → Kafka → 소비자   (src/timescaledb)
#   mqtt-direct: EMQX → 소비자 (ISL 없음)                                 (이 스택)
#   isl-db     : Agent → Engine → Db.Provider → DB 함수                  (호스트 프로세스 + 이 스택 DB)
#                Db.Provider 는 lidar_ingest_* 를 textfile 로 쓰고 pipeline 레이블을 스스로 단다 → isl-process job 으로 들어온다
scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ["lidar-ingest:8000"]          # tsdb-net
        labels: {pipeline: isl-kafka}
      - targets: ["lidar-direct-ingest:8000"]   # cmp-net
        labels: {pipeline: mqtt-direct}

  - job_name: hotdb
    static_configs:
      - targets: ["tsdb-exporter:9187"]         # tsdb-net · tsdb-lidar-pg
        labels: {pipeline: isl-kafka}
      - targets: ["direct-exporter:9187"]       # cmp-net · cmp-direct-pg
        labels: {pipeline: mqtt-direct}
      - targets: ["provider-exporter:9187"]     # cmp-net · cmp-provider-pg
        labels: {pipeline: isl-db}

  - job_name: podman
    static_configs:
      - targets: ["podman-exporter:9882"]

  # 호스트에서 도는 ISL 프로세스(Engine · Mqtt.Agent · EES.Kafka.Provider · Db.Provider). scripts/isl-process-metrics.ps1
  # 와 Db.Provider 의 적재 지표(isl-db-provider.prom)
  - job_name: isl-process
    static_configs:
      - targets: ["isl-process-exporter:9100"]
