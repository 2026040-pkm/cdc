# TimescaleDB(lidar) 전용 커스텀 쿼리
# 메트릭 이름 = <최상위 키>_<컬럼명>  (예: tsdb_hypertable_total_bytes{hypertable="lidar_status"})
#
# postgres_exporter 기본 수집기(pg_stat_database·pg_stat_activity·pg_locks·
# pg_stat_user_tables·pg_stat_bgwriter 등)가 PostgreSQL 일반 지표를 이미 낸다.
# 여기에는 TimescaleDB 라서 생기는 것과, 이 스택의 적재 표에서만 답할 수 있는 것을 둔다.
#
# 스크랩은 5초마다다. 하이퍼테이블 전체를 훑는 쿼리는 넣지 않는다 —
# 행 수는 approximate_row_count, 장비 상태는 lidar_device_state(장비당 한 행)에서 읽는다.

# ── 하이퍼테이블 크기 · 청크 ────────────────────────────────────────────────
# 연속 집계의 내부 하이퍼테이블(_materialized_hypertable_N)도 같이 잡힌다.
# 대시보드는 hypertable 라벨로 걸러 본체(lidar_status)만 크게 그린다.
tsdb_hypertable:
  query: |
    SELECT h.hypertable_name                       AS hypertable,
           s.table_bytes::float                    AS table_bytes,
           s.index_bytes::float                    AS index_bytes,
           s.toast_bytes::float                    AS toast_bytes,
           s.total_bytes::float                    AS total_bytes,
           (SELECT count(*) FROM timescaledb_information.chunks c
             WHERE c.hypertable_schema = h.hypertable_schema
               AND c.hypertable_name = h.hypertable_name)::float AS chunks,
           (SELECT count(*) FROM timescaledb_information.chunks c
             WHERE c.hypertable_schema = h.hypertable_schema
               AND c.hypertable_name = h.hypertable_name
               AND c.is_compressed)::float AS compressed_chunks
    FROM timescaledb_information.hypertables h
    CROSS JOIN LATERAL hypertable_detailed_size(format('%I.%I', h.hypertable_schema, h.hypertable_name)) s
  metrics:
    - hypertable:
        usage: "LABEL"
        description: "hypertable name"
    - table_bytes:
        usage: "GAUGE"
        description: "heap bytes (all chunks)"
    - index_bytes:
        usage: "GAUGE"
        description: "index bytes (all chunks)"
    - toast_bytes:
        usage: "GAUGE"
        description: "toast bytes (all chunks)"
    - total_bytes:
        usage: "GAUGE"
        description: "table + index + toast"
    - chunks:
        usage: "GAUGE"
        description: "number of chunks"
    - compressed_chunks:
        usage: "GAUGE"
        description: "number of chunks already converted to columnstore"

# ── 압축 효과 ───────────────────────────────────────────────────────────────
# 압축된 청크가 하나도 없으면 두 값 다 NULL 이라 0 으로 메운다.
# 압축률 = 1 - after/before 를 대시보드에서 계산한다.
tsdb_compression:
  query: |
    SELECT h.hypertable_name                                       AS hypertable,
           COALESCE(s.before_compression_total_bytes, 0)::float    AS before_bytes,
           COALESCE(s.after_compression_total_bytes, 0)::float     AS after_bytes,
           COALESCE(s.number_compressed_chunks, 0)::float          AS compressed_chunks
    FROM (VALUES ('lidar_status',        'tsdb.lidar_status'),
                 ('lidar_scan_actual',   'tsdb.lidar_scan_actual'),
                 ('lidar_scan_artifact', 'tsdb.lidar_scan_artifact')) h(hypertable_name, ref)
    CROSS JOIN LATERAL hypertable_compression_stats(h.ref::regclass) s
  metrics:
    - hypertable:
        usage: "LABEL"
        description: "hypertable name"
    - before_bytes:
        usage: "GAUGE"
        description: "bytes of compressed chunks before compression"
    - after_bytes:
        usage: "GAUGE"
        description: "bytes of compressed chunks after compression"
    - compressed_chunks:
        usage: "GAUGE"
        description: "number of compressed chunks"

# ── 행 수 (근사) ────────────────────────────────────────────────────────────
# count(*) 는 청크마다 전체 스캔이라 5초 스크랩에 못 넣는다. 카탈로그 통계 기반 근사값.
tsdb_rows:
  query: |
    SELECT 'lidar_status' AS hypertable, approximate_row_count('tsdb.lidar_status')::float AS approx
    UNION ALL
    SELECT 'lidar_scan_actual', approximate_row_count('tsdb.lidar_scan_actual')::float
    UNION ALL
    SELECT 'lidar_scan_artifact', approximate_row_count('tsdb.lidar_scan_artifact')::float
    UNION ALL
    SELECT 'lidar_status_message', (SELECT count(*) FROM rdb.lidar_status_message)::float
    UNION ALL
    SELECT 'lidar_ingest_reject', (SELECT count(*) FROM rdb.lidar_ingest_reject)::float
  metrics:
    - hypertable:
        usage: "LABEL"
        description: "table name"
    - approx:
        usage: "GAUGE"
        description: "row count — 하이퍼테이블은 approximate_row_count, 나머지는 정확한 count"

# ── 백그라운드 잡 (압축 · 보존 · 연속 집계 갱신) ────────────────────────────
# 정책이 실패하고 있으면 디스크가 안 줄고 집계가 멈춘다. 대시보드에서 표로 보인다.
tsdb_job:
  query: |
    SELECT j.job_id::text                                              AS job_id,
           j.proc_name                                                 AS proc_name,
           COALESCE(j.hypertable_name, '')                             AS hypertable,
           CASE WHEN s.last_run_status = 'Success' THEN 1 ELSE 0 END::float AS last_run_ok,
           COALESCE(s.total_failures, 0)::float                        AS total_failures,
           COALESCE(s.total_runs, 0)::float                            AS total_runs,
           COALESCE(extract(epoch from s.last_run_duration), 0)::float AS last_run_seconds,
           COALESCE(extract(epoch from (s.next_start - now())), 0)::float AS next_start_in_seconds
    FROM timescaledb_information.jobs j
    LEFT JOIN timescaledb_information.job_stats s ON s.job_id = j.job_id
    WHERE j.job_id >= 1000   -- 사용자 정책만. 1000 미만은 텔레메트리 등 내부 잡
  metrics:
    - job_id:
        usage: "LABEL"
        description: "job id"
    - proc_name:
        usage: "LABEL"
        description: "policy_compression / policy_retention / policy_refresh_continuous_aggregate"
    - hypertable:
        usage: "LABEL"
        description: "target hypertable (연속 집계는 내부 materialized hypertable 이름)"
    - last_run_ok:
        usage: "GAUGE"
        description: "1 if the last run succeeded (아직 안 돌았으면 0)"
    - total_failures:
        usage: "COUNTER"
        description: "cumulative failures"
    - total_runs:
        usage: "COUNTER"
        description: "cumulative runs"
    - last_run_seconds:
        usage: "GAUGE"
        description: "duration of the last run"
    - next_start_in_seconds:
        usage: "GAUGE"
        description: "seconds until the next scheduled run (음수면 밀린 것)"

# ── 장비 상태 집계 ──────────────────────────────────────────────────────────
# lidar_device_state 는 장비당 한 행(약 350행)이라 매 스크랩 읽어도 가볍다.
# 상태가 하나도 없는 값은 시계열이 사라져 "No data" 가 되므로 네 상태를 0 으로 채운다.
# 네 가지는 발행 측의 상태 전이 그대로다 — ONLINE ↔ CALIBRATING · ONLINE → ERROR → OFFLINE.
tsdb_lidar_devices:
  query: |
    SELECT s.status, COALESCE(d.cnt, 0)::float AS count
    FROM (VALUES ('ONLINE'), ('CALIBRATING'), ('ERROR'), ('OFFLINE')) s(status)
    LEFT JOIN (SELECT status, count(*) AS cnt FROM rdb.lidar_device_state GROUP BY status) d
           ON d.status = s.status
  metrics:
    - status:
        usage: "LABEL"
        description: "ONLINE / CALIBRATING / ERROR / OFFLINE"
    - count:
        usage: "GAUGE"
        description: "number of devices whose latest event carries this status"

# 마지막 이벤트가 60초 넘게 안 온 장비 수 + 전체 장비 수 + 신선도.
# 상태 발신 주기가 1초라 60초는 예순 번을 건너뛴 것이다.
tsdb_lidar_fleet:
  query: |
    SELECT count(*)::float                                                          AS devices,
           count(*) FILTER (WHERE last_event_at < now() - interval '60 seconds')::float AS stale,
           COALESCE(extract(epoch from (now() - max(last_event_at))), 0)::float     AS freshness_seconds
    FROM rdb.lidar_device_state
  metrics:
    - devices:
        usage: "GAUGE"
        description: "distinct devices ever seen"
    - stale:
        usage: "GAUGE"
        description: "devices silent for more than 60s"
    - freshness_seconds:
        usage: "GAUGE"
        description: "age of the newest event in the DB (계속 커지면 적재가 멈춘 것)"

# 오류 코드별 현재 장비 수. 코드는 ERROR 상태에서만 붙고, 빠져나오면 NULL 로 돌아간다.
tsdb_lidar_error:
  query: |
    SELECT error_code, count(*)::float AS devices
    FROM rdb.lidar_device_state
    WHERE error_code IS NOT NULL
    GROUP BY error_code
  metrics:
    - error_code:
        usage: "LABEL"
        description: "error code on the device's latest event"
    - devices:
        usage: "GAUGE"
        description: "devices currently reporting this code"

# ── WAL ─────────────────────────────────────────────────────────────────────
# 적재는 INSERT 뿐이지만 압축 잡이 돌 때 WAL 이 크게 뛴다. 그 순간을 잡는다.
tsdb_wal:
  query: |
    SELECT COALESCE(sum(size), 0)::float AS size_bytes,
           count(*)::float               AS files,
           pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0'::pg_lsn)::float AS lsn_bytes_total
    FROM pg_ls_waldir()
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "total bytes held in pg_wal/"
    - files:
        usage: "GAUGE"
        description: "number of WAL segment files"
    - lsn_bytes_total:
        usage: "COUNTER"
        description: "current WAL LSN as a byte offset — rate() 로 WAL 생성률(B/s)"

# ── DB 크기 · 백그라운드 워커 ───────────────────────────────────────────────
tsdb_db:
  query: |
    SELECT pg_database_size(current_database())::float AS size_bytes,
           (SELECT count(*) FROM pg_stat_activity WHERE datname = current_database())::float AS connections,
           (SELECT count(*) FROM pg_stat_activity WHERE backend_type LIKE 'TimescaleDB%')::float AS ts_workers,
           current_setting('timescaledb.max_background_workers')::float AS ts_workers_max
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "database size on disk"
    - connections:
        usage: "GAUGE"
        description: "current backend connections to this database"
    - ts_workers:
        usage: "GAUGE"
        description: "TimescaleDB background workers currently running"
    - ts_workers_max:
        usage: "GAUGE"
        description: "timescaledb.max_background_workers"
