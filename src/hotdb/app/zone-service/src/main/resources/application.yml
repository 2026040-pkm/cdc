# ─────────────────────────────────────────────────────────────────────────────
# 실적 판별 모듈 — tsdb(CDC) → hot.m_device · m_device_state · s_scan_* · ts.*  →  판별 → hot.p_*   (통합안 · 정규화, V17)
#
# 판별 모듈은 ZONE 하나로 고른다:  mch(가공) · asm(조립) · oft(의장) · pnt(도장) — 늘 수 있다
#   → 권역 코드(tsdb.device.zone 값)는 ZONE_CODE 로 주거나, application-<zone>.yml 에 둔다.
#   → 새 모듈: V 파일에 SELECT ops.provision_module('<zone>', '<ZONE_CODE>', '<이름>'); 한 줄 + ops.module.trade + compose 서비스 하나.
#   → 계정 · 슬롯 · 오프셋 이름은 전부 ZONE 에서 나온다 (겹치면 슬롯을 다툰다).
#
# 표 (V17 통합안 · 정규화):
#   tsdb.device          → hot.m_device (장비 개체, 설치 정보만 · zone 으로 모듈 분담)
#   tsdb.status_history  → hot.m_device_state (현재 상태 1행) · ts.device_signal (신호 값 — 사전 m_signal_code 의 코드로 풀어서)
#   tsdb.actual_history  → hot.s_scan_session (회차) · hot.s_scan_device (참여 장비) · ts.sensor_event (원문 1:1)
#                        → hot.s_scan_detection (COMPLETE 만 · 인식 객체 = 블록, judged=false 로 넣는다)
#   tsdb.artifact_history→ hot.s_scan_session 의 raw_dir · artifact_dir (설계대로 경로만 — 산출물 1건 표는 없다)
#
# 실적 판별 (hotdb.judge): 라우트는 s_scan_detection 을 judged=false 로 넣기만 하고, 판별 단계(다른 스레드)가
#   자기 모듈 회차(s_scan_session.zone)의 것을 집어 앵커(l_work_unit)에 매칭해 p_progress · p_progress_block 을 쓴다.
#   가공(mch)은 센서가 없어 절점 판별(hotdb.judge.checkpoint)이 l_event · l_cut_part 로 p_progress 를 쓴다.
#
# 스키마가 바뀌면: 1) db/migration 에 V 파일   2) 아래 hotdb.routes 의 columns.  코드는 손대지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: zone-${ZONE:asm}
  profiles:
    active: ${ZONE:asm}
  datasource:
    url: jdbc:postgresql://${HOTDB_HOST:localhost}:${HOTDB_PORT:59433}/${HOTDB_DB:hotdb}?ApplicationName=zone-${ZONE:asm}&reWriteBatchedInserts=true
    username: ${HOTDB_USER:svc_${ZONE:asm}}
    password: ${HOTDB_PASSWORD:svc_${ZONE:asm}}
    hikari:
      maximum-pool-size: 4

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      pipeline: zone-${ZONE:asm}
      zone: ${ZONE:asm}

hotdb:
  zone:
    module: ${ZONE:asm}
    code: ${ZONE_CODE:}       # 비우면 application-<zone>.yml 의 값

  cdc:
    pipeline: zone-${ZONE:asm}
    source:
      host: ${HOTDB_HOST:localhost}
      port: ${HOTDB_PORT:59433}
      database: ${HOTDB_DB:hotdb}
      user: ${HOTDB_USER:svc_${ZONE:asm}}
      password: ${HOTDB_PASSWORD:svc_${ZONE:asm}}
    slot: zone_${ZONE:asm}
    publication: tsdb_cdc_pub
    # 하이퍼테이블 행은 청크로 온다 — 청크 정규식으로 받고, 논리 이름은 cdc-core 가 되돌린다.
    # ts.* 의 청크는 ts_chunks 스키마라 여기 안 걸린다 (V17) — 자기가 쓴 행을 다시 받지 않는다.
    include-tables:
      - tsdb\.device
      - tsdb\.tag_catalog
      - ops\.cdc_heartbeat
      - _timescaledb_internal\._hyper_[0-9]+_[0-9]+_chunk
    snapshot-mode: no_data
    offset-file: ${CDC_OFFSET_DIR:./data}/offsets-zone-${ZONE:asm}.dat
    max-batch-size: ${CDC_MAX_BATCH_SIZE:2048}
    max-queue-size: ${CDC_MAX_QUEUE_SIZE:8192}
    max-queue-size-bytes: ${CDC_MAX_QUEUE_BYTES:67108864}   # 64MB (힙 -Xmx256m 의 1/4 안쪽)
    strict-source: true

  judge:
    enabled: ${JUDGE_ENABLED:true}
    interval-ms: 1000
    batch-size: 200
    threshold:                      # 센서 판별 — 둘 다 넘어야 done, 정합도만 넘으면 inProgress, 정합도가 모자라면 보류(알림)
      min-progress-rate: 100        # progress_est (0~100)
      min-match-confidence: 0.9     # match_conf (0~1)
    checkpoint:                     # 절점 판별 (가공) — l_event · l_cut_part → p_progress. application-mch.yml 이 켠다
      enabled: false
      interval-ms: 30000
      batch-size: 500
    legacy:                         # 레거시 실적 판별 (도장 · 의장) — l_wo_daily · l_paint_element · l_outfit_item → p_progress
      enabled: false                #   application-pnt.yml · application-oft.yml 이 켠다
      interval-ms: ${JUDGE_LEGACY_INTERVAL_MS:60000}
      batch-size: 500
      refresh-minutes: 10           #   오늘 판정이 있어도 이만큼 지나면 다시 본다

  # tag_key → 장비 · 권역. 이력에는 tag_key 만 있어서 권역을 거르려면 이게 필요하다.
  lookups:
    tag:
      key: tag_key
      sql: >-
        SELECT t.tag_key, t.device_id, t.channel, t.artifact_type, d.zone, d.site, d.shop, d.bay, d.device_role
          FROM tsdb.tag_catalog t
          JOIN tsdb.device d ON d.site = t.site AND d.device_id = t.device_id
      reload-on: [tsdb.tag_catalog, tsdb.device]

  routes:
    # ── 장비 마스터 (tsdb.device 가 바뀔 때) ─────────────────────────────────
    - name: device-master
      source: tsdb.device
      when: [ "row.zone=${hotdb.zone.code}" ]
      target: hot.m_device
      mode: upsert
      keys: [ device_id ]
      columns:
        device_id: row.device_id
        class_code: row.device_role         # LIDAR … (m_code DEVICE_CLASS)
        category: "'SENSOR'"
        shop_code: row.shop
        bay_code: row.bay
        zone: row.zone
        valid_to: "null if row.active=true else $now | overwrite"

    # 장비 자리 — 상태 · 실적이 m_device 에 없는 장비로 오면 먼저 만든다 (있으면 그대로).
    # tsdb.device 등록이 이 모듈 슬롯이 생기기 전이면 device-master 로는 안 온다 (snapshot no_data) — 2026-10-23 V17 기동 때
    # 조립 장비 210대가 그래서 m_device_state · s_scan_device 의 FK 에 막혔다. 이 라우트들은 device-state · scan-device 보다 위에 둔다
    - name: device-stub-status
      source: tsdb.status_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: hot.m_device
      mode: insert
      columns:
        device_id: tag.device_id
        class_code: tag.device_role
        category: "'SENSOR'"
        shop_code: tag.shop
        bay_code: tag.bay
        zone: tag.zone

    - name: device-stub-actual
      source: tsdb.actual_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: hot.m_device
      mode: insert
      columns:
        device_id: tag.device_id
        class_code: tag.device_role
        category: "'SENSOR'"
        shop_code: tag.shop
        bay_code: tag.bay
        zone: tag.zone

    # ── status (1초) → 장비 현재 상태 1행 ────────────────────────────────────
    - name: device-state
      source: tsdb.status_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: hot.m_device_state
      mode: upsert
      keys: [ device_id ]
      newer-than: last_seen             # 늦게 온 옛 이벤트가 최신값을 덮지 않게
      lag-from: row.received_at
      columns:
        device_id: tag.device_id
        last_seen: row.event_time
        online: "'true' if row.status=ONLINE|CALIBRATING else 'false'"
        fault: "'true' if row.status=ERROR else 'false'"
        fault_code: row.error_code
        src_received_at: row.received_at
        updated_at: $now

    # ── status → ts.device_signal (신호 코드별 한 행 · 사전 m_signal_code) ───
    - name: signal-status
      source: tsdb.status_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: ts.device_signal
      mode: insert
      columns:
        time: row.event_time
        device_id: tag.device_id
        signal_code: "'status'"
        kind: "'SIGNAL'"
        value_text: row.status
        quality: row.error_code

    - name: signal-temperature
      source: tsdb.status_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}", "row.temperature_c not null" ]
      target: ts.device_signal
      mode: insert
      columns:
        time: row.event_time
        device_id: tag.device_id
        signal_code: "'temperature'"
        kind: "'SIGNAL'"
        value_num: row.temperature_c

    - name: signal-scan-rate
      source: tsdb.status_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}", "row.scan_rate_pts_per_sec not null" ]
      target: ts.device_signal
      mode: insert
      columns:
        time: row.event_time
        device_id: tag.device_id
        signal_code: "'scan_rate'"
        kind: "'SIGNAL'"
        value_num: row.scan_rate_pts_per_sec

    - name: signal-rssi
      source: tsdb.status_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}", "row.connectivity_rssi not null" ]
      target: ts.device_signal
      mode: insert
      columns:
        time: row.event_time
        device_id: tag.device_id
        signal_code: "'rssi'"
        kind: "'SIGNAL'"
        value_num: row.connectivity_rssi

    # ── actual (1분) → 스캔 회차 · 참여 장비 · 원문 · 인식 객체 ───────────────
    - name: scan-session
      source: tsdb.actual_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: hot.s_scan_session
      mode: upsert
      keys: [ scan_id ]
      newer-than: last_msg_ts
      lag-from: row.received_at
      columns:
        scan_id: row.scan_id
        zone: tag.zone
        scan_ts: row.scanned_at | coalesce
        model_ver: row.model_version | coalesce
        first_msg_ts: row.received_at | min       # 산출물이 먼저 만든 자리(scan-stub)보다 START 가 이르면 그 값
        last_msg_ts: row.received_at
        status: "'CLOSED' if row.event_type=COMPLETE else 'OPEN'"

    - name: scan-device
      source: tsdb.actual_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: hot.s_scan_device
      mode: insert
      columns:
        scan_id: row.scan_id
        device_id: tag.device_id
        role: "'PRIMARY'"

    # 원문 1:1 — 실적 메시지(A) 1건 = ts.sensor_event 1행. event_id 는 원천 변경 위치(LSN)
    - name: sensor-event
      source: tsdb.actual_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: ts.sensor_event
      mode: insert
      columns:
        time: row.event_time
        event_id: meta.lsn
        scan_id: row.scan_id
        object_key: row.block_id
        zone: tag.zone
        hull_no: row.hull_no
        block_no: row.block_id
        object_type: "'BLOCK'"
        event_type: row.event_type
        source_system: "'ISL'"
        idempotency_key: row.source_time_text

    # 인식 객체 = 블록 (COMPLETE 만). 판별 단계가 anchor_id · judged · judged_ts 를 채운다 — 재전송이 되돌리지 않게 keep
    - name: scan-detection
      source: tsdb.actual_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}", "row.event_type=COMPLETE" ]
      target: hot.s_scan_detection
      mode: upsert
      keys: [ scan_id, object_key ]
      lag-from: row.received_at
      columns:
        scan_id: row.scan_id
        object_key: row.block_id
        event_id: meta.lsn | keep
        received_ts: row.received_at
        object_type: "'BLOCK'"
        hull_no: row.hull_no
        block_no: row.block_id
        match_conf: row.match_confidence
        progress_est: row.block_progress_rate
        event_type: row.event_type
        model_ver: row.model_version
        judged: "'false' | keep"
        judged_ts: "null | keep"
        anchor_id: "null | keep"
        anchor_type: "null | keep"

    # ── artifact (1분 × 12건) → 회차의 산출물 경로 ────────────────────────────
    # 산출물이 스캔 START 보다 먼저 올 수 있다 — 회차 자리를 먼저 만들고(없으면), 경로만 적는다.
    # last_msg_ts 를 -infinity 로 두어 뒤에 오는 START · PROGRESS 가 newer-than 을 통과해 제자리 값으로 덮게 한다.
    - name: scan-stub
      source: tsdb.artifact_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}" ]
      target: hot.s_scan_session
      mode: insert
      columns:
        scan_id: row.scan_id
        zone: tag.zone
        first_msg_ts: row.received_at
        last_msg_ts: "'-infinity'"
        status: "'OPEN'"

    - name: scan-artifact-dirs
      source: tsdb.artifact_history
      lookups: { tag: row.tag_key }
      when: [ "tag.zone=${hotdb.zone.code}", "row.artifact_type=REGISTERED_PCD|SEGMENTED_PCD" ]
      target: hot.s_scan_session
      mode: upsert
      keys: [ scan_id ]
      lag-from: row.received_at
      columns:
        scan_id: row.scan_id
        zone: tag.zone | coalesce
        raw_dir: row.storage_uri if row.artifact_type=REGISTERED_PCD | coalesce
        artifact_dir: row.storage_uri if row.artifact_type=SEGMENTED_PCD | coalesce
        model_ver: row.model_version | coalesce
        first_msg_ts: row.received_at | min
        last_msg_ts: row.received_at | max

logging:
  level:
    dev.hotdb: info
    io.debezium: info
