# ─────────────────────────────────────────────────────────────────────────────
# RFC Service (O-8) — 세 방향
#   ① SAP 폴링 → 레거시 DB erp 사본                      (poll-core, 작업 목록 poll-jobs.yml, 대상 기본 = 레거시 DB)
#   ② 레거시 사본 폴링 → Hot DB hot.m_* · l_*            (poll-core, 작업 목록 poll-jobs-hot.yml, 대상 hot = Hot DB)
#   ③ hot.p_progress(CDC) → SAP Z 표 zhotdb_progress    (2단 CDC, 계정 rfc_service)
#
#   1단: tsdb ─(slot zone_<모듈>, tsdb_cdc_pub)─▶ 판별 모듈 ─▶ hot.s_* · m_device_state · ts.* → 판별 ─▶ hot.p_progress
#   2단: hot ─(slot rfc_service, hot_cdc_pub)─▶ 이 서비스 ─▶ SAP
#
# hot_cdc_pub 에는 p_progress 만 실려 있다 (V17). SAP 송신은 RFC_SENDER=jdbc · dry-run.
# ② 의 원천은 레거시 DB 사본 — 로컬은 inshoplocal(docker, 54433), 운영은 HANA · Oracle 사본. 적재 SQL 은
#   PostgreSQL 사본 기준으로 적었다 (poll-jobs-hot.yml). HANA 로 바꾸면 날짜 변환 식만 손본다.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: rfc-service
  config:
    import:
      - classpath:poll-jobs.yml
      - classpath:poll-jobs-hot.yml
  datasource:
    url: jdbc:postgresql://${HOTDB_HOST:localhost}:${HOTDB_PORT:59433}/${HOTDB_DB:hotdb}?ApplicationName=rfc-service
    username: ${HOTDB_USER:rfc_service}
    password: ${HOTDB_PASSWORD:rfc_service}
    hikari:
      maximum-pool-size: 2

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      pipeline: rfc-service

hotdb:
  cdc:
    pipeline: rfc-service
    source:
      host: ${HOTDB_HOST:localhost}
      port: ${HOTDB_PORT:59433}
      database: ${HOTDB_DB:hotdb}
      user: ${HOTDB_USER:rfc_service}
      password: ${HOTDB_PASSWORD:rfc_service}
    slot: rfc_service
    publication: hot_cdc_pub
    include-tables:
      - ops\.cdc_heartbeat
      - hot\.p_progress          # 앵커 × 기준일 실적 — 판별 모듈 전부 한 표
    # hot.p_progress 는 작다. 처음 붙을 때 이미 있는 실적도 보낸다 — 이미 보낸 것은 ops.rfc_progress_sent 가 거른다
    snapshot-mode: initial
    offset-file: ${CDC_OFFSET_DIR:./data}/offsets-rfc-service.dat
    max-batch-size: 512
    # 적체 때 프로세스 메모리 상한 — 큐가 차면 엔진이 슬롯 읽기를 멈추고(backpressure) 밀린 것은 원천 WAL 에 남는다
    max-queue-size: ${CDC_MAX_QUEUE_SIZE:8192}
    max-queue-size-bytes: ${CDC_MAX_QUEUE_BYTES:33554432}   # 32MB (힙 -Xmx192m 의 1/4 안쪽)

  rfc:
    max-retries: 5
    backoff-ms: 500
    # dry-run: 로그만 · jdbc: SAP Z 테이블에 INSERT (운영 HANA / 로컬 SAP 대역). JCo 가 생기면 jco
    sender: ${RFC_SENDER:dry-run}
    sap:
      url: ${SAP_URL:jdbc:postgresql://localhost:59434/sapsim}
      user: ${SAP_USER:sapsim}
      password: ${SAP_PASSWORD:sapsim}
      table: ${SAP_RESULT_TABLE:erpsrc.zhotdb_progress}

  # ── ① SAP → erp 폴링 · ② 레거시 사본 → hot 적재 ───────────────────────
  # 운영 HANA: SAP_URL=jdbc:sap://<host>:<port>/?currentschema=<스키마> , SAP_SCHEMA=<스키마>
  # 워터마크 upd_date || upd_time = 원천 표의 최종 수정 일자 · 시각 (DATS · TIMS 문자열)
  poll:
    agent: rfc-service
    default-interval-ms: ${POLL_INTERVAL_MS:60000}
    threads: ${POLL_THREADS:4}
    target:   # 기본 대상 = 레거시 DB 의 erp — rfc_agent 만 쓴다 (Hot DB 와 분리된 별도 DB)
      url: jdbc:postgresql://${LEGACY_HOST:localhost}:${LEGACY_PORT:59435}/${LEGACY_DB:legacy}?ApplicationName=rfc-service-poll&reWriteBatchedInserts=true
      user: ${HOTDB_POLL_USER:rfc_agent}
      password: ${HOTDB_POLL_PASSWORD:rfc_agent}
    targets:
      hot:    # Hot DB 의 hot 스키마 — rfc_service 가 m_* · l_* 를 쓴다. 진행 상태는 Hot DB 의 ops.poll_state
        url: jdbc:postgresql://${HOTDB_HOST:localhost}:${HOTDB_PORT:59433}/${HOTDB_DB:hotdb}?ApplicationName=rfc-service-hot&reWriteBatchedInserts=true
        user: ${HOTDB_USER:rfc_service}
        password: ${HOTDB_PASSWORD:rfc_service}
    sources:
      sap:
        url: ${SAP_URL:jdbc:postgresql://localhost:59434/sapsim}
        user: ${SAP_USER:sapsim}
        password: ${SAP_PASSWORD:sapsim}
      legacy:   # 레거시 사본 중 SAP 출신 (PostgreSQL inshoplocal 계열) — gp.* (+ bak.*)
        url: ${LEGACY_SRC_URL:jdbc:postgresql://localhost:54433/inshoplocal}
        user: ${LEGACY_SRC_USER:inshoplocal}
        password: ${LEGACY_SRC_PASSWORD:inshoplocal}
      legacy-oracle:   # 레거시 사본 중 Oracle 출신 (inshoplocal-oracle) — AM(ProSSYS) · APNB(BTS) · SDE(GIS)
        url: ${LEGACY_ORA_URL:jdbc:oracle:thin:@//localhost:59522/FREEPDB1}
        user: ${LEGACY_ORA_USER:inshoplocal_reader}
        password: ${LEGACY_ORA_PASSWORD:inshoplocal_reader}
    # 작업 목록: poll-jobs.yml (SAP 사본 114표, scripts/gen-sample-legacy.py 생성) · poll-jobs-hot.yml (hot 적재, 손으로 적음)

logging:
  level:
    dev.hotdb: info
    io.debezium: info
