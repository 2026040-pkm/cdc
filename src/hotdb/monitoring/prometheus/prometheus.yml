global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

# 대상은 targets/*.json 에 있다. 서버 to 서버로 나눠 띄울 때는 그 파일의 주소만
# 실제 서버 IP:포트로 바꾼다 (Prometheus 가 30초마다 다시 읽는다 — 재시작 불필요).
scrape_configs:
  - job_name: zone-service
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/zone-service.json], refresh_interval: 30s }]

  # 2단 CDC: svc_* 실적 → SAP
  - job_name: rfc-provider
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/rfc-provider.json], refresh_interval: 30s }]

  - job_name: db-agent
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/db-agent.json], refresh_interval: 30s }]

  - job_name: field-simulator
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/field-simulator.json], refresh_interval: 30s }]

  # 레거시 발행기 (SAP · Oracle 대역 원천 표를 바꾼다) — 레거시 서버에 떠 있다
  - job_name: legacy-simulator
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/legacy-simulator.json], refresh_interval: 30s }]

  - job_name: hotdb
    file_sd_configs: [{ files: [/etc/prometheus/targets/hotdb.json], refresh_interval: 30s }]

  # 레거시 DB (SAP · Oracle 사본, 폴링 상태)
  - job_name: legacy-db
    file_sd_configs: [{ files: [/etc/prometheus/targets/legacy-db.json], refresh_interval: 30s }]

  # 컨테이너 CPU · 메모리 (podman 소켓). 서버마다 하나씩
  - job_name: podman
    file_sd_configs: [{ files: [/etc/prometheus/targets/podman.json], refresh_interval: 30s }]

  # 호스트 CPU · 메모리 · 디스크 · 네트워크. 서버마다 하나씩
  - job_name: node
    file_sd_configs: [{ files: [/etc/prometheus/targets/node.json], refresh_interval: 30s }]
