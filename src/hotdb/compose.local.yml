# 한 대에 전부 띄울 때만 덧붙인다 (scripts/up.ps1). 기동 순서를 잡는다:
# DB → 마이그레이션 완료 → 판별 모듈 · RFC Service · DB Agent · 발행기 (레거시 대역이 먼저 떠 있어야 폴링이 성공)
services:
  zone-asm:
    depends_on: &after-migrate
      hotdb-migrate: { condition: service_completed_successfully }
  zone-oft:
    depends_on: *after-migrate
  zone-pnt:
    depends_on: *after-migrate
  zone-mch:
    depends_on: *after-migrate
  rfc-service:
    environment:
      RFC_SENDER: jdbc
    depends_on:
      hotdb-migrate: { condition: service_completed_successfully }
      legacy-migrate: { condition: service_completed_successfully }
      sap-sim: { condition: service_healthy }
  db-agent:
    depends_on:
      legacy-migrate: { condition: service_completed_successfully }
      oracle-sim: { condition: service_healthy }
  field-simulator:
    depends_on: *after-migrate
