# ─────────────────────────────────────────────────────────────────────────────
# RFC Service (O-8) — ① SAP 폴링 → 레거시 DB erp  ② 레거시 사본 → Hot DB hot.l_* · m_* 적재  ③ hot.p_progress CDC → SAP (2단 CDC)
#   (모듈 · 컨테이너 · 계정 · 슬롯 · 지표 모두 rfc-service / rfc_service — V14 에서 rfc-provider 이름을 정리)
#
#   한 대에 전부:   scripts/up.ps1
#   RFC AGENT 서버: .env 에 HOTDB_HOST=<HotDB 서버 IP>, HOTDB_PORT=59433 을 적고
#                   podman compose -f compose.rfc.yml up -d
#
# 슬롯 rfc_service 하나로 hot.p_progress 를 받는다 (hot_cdc_pub). SAP 송신: RFC_SENDER=jdbc(Z 표 zhotdb_progress) · dry-run
# ─────────────────────────────────────────────────────────────────────────────
name: hotdb

services:
  rfc-service:
    build:
      context: ./app
      args: { MODULE: rfc-service }
    image: localhost/hotdb/rfc-service:local
    container_name: hotdb-rfc-service
    restart: on-failure
    environment:
      HOTDB_HOST: ${HOTDB_HOST:-hotdb-pg}
      HOTDB_PORT: ${HOTDB_PORT:-5432}
      CDC_OFFSET_DIR: /app/data
      LEGACY_HOST: ${LEGACY_HOST:-legacy-db}     # SAP 폴링 결과(erp)를 쓰는 레거시 DB
      LEGACY_PORT: ${LEGACY_PORT:-5432}
      # SAP — 운영: jdbc:sap://<host>:<port>/?currentschema=<스키마> · SAP_SCHEMA=<스키마>. 기본은 로컬 대역 sap-sim
      RFC_SENDER: ${RFC_SENDER:-dry-run}     # 로컬(compose.local.yml)은 jdbc — sap-sim 의 Z 표에 쓴다
      SAP_URL: ${SAP_URL:-jdbc:postgresql://sap-sim:5432/sapsim}
      SAP_USER: ${SAP_USER:-sapsim}
      SAP_PASSWORD: ${SAP_PASSWORD:-sapsim}
      SAP_SCHEMA: ${SAP_SCHEMA:-erpsrc}
      SAP_RESULT_TABLE: ${SAP_RESULT_TABLE:-erpsrc.zhotdb_progress}
      # ② 레거시 사본 → hot.m_* · l_* 적재 원천 (inshoplocal). 운영은 HANA 사본 주소로
      LEGACY_SRC_URL: ${LEGACY_SRC_URL:-jdbc:postgresql://host.docker.internal:54433/inshoplocal}
      LEGACY_SRC_USER: ${LEGACY_SRC_USER:-inshoplocal}
      LEGACY_SRC_PASSWORD: ${LEGACY_SRC_PASSWORD:-inshoplocal}
      # ② 의 Oracle 출신 원천 (inshoplocal-oracle: AM · APNB · SDE)
      LEGACY_ORA_URL: ${LEGACY_ORA_URL:-jdbc:oracle:thin:@//host.docker.internal:59522/FREEPDB1}
      LEGACY_ORA_USER: ${LEGACY_ORA_USER:-inshoplocal_reader}
      LEGACY_ORA_PASSWORD: ${LEGACY_ORA_PASSWORD:-inshoplocal_reader}
      POLL_HOT_INTERVAL_MS: ${POLL_HOT_INTERVAL_MS:-300000}
      POLL_HOT_MASTER_INTERVAL_MS: ${POLL_HOT_MASTER_INTERVAL_MS:-600000}
      POLL_HOT_RESYNC_INTERVAL_MS: ${POLL_HOT_RESYNC_INTERVAL_MS:-86400000}   # 증분 작업의 전체 재동기화 (V20 F5)
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
      POLL_FAST_INTERVAL_MS: ${POLL_FAST_INTERVAL_MS:-10000}
      JAVA_TOOL_OPTIONS: ${RFC_JAVA_OPTS:--Xms64m -Xmx192m}
    ports: ["${RFC_PROVIDER_PORT:-59485}:8080"]
    volumes: [rfc-service-data:/app/data]

# Debezium 오프셋 파일. 지우면 슬롯의 confirmed_flush 위치부터 다시 받는다 — 유실은 없다
volumes:
  rfc-service-data:
