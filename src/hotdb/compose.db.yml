# ─────────────────────────────────────────────────────────────────────────────
# Hot DB(필드 DB) 서버 — PostgreSQL 17 + TimescaleDB + logical WAL, 마이그레이션, exporter
#   tsdb · svc · ops 만. 레거시(SAP · Oracle 사본)는 compose.legacy.yml 의 별도 DB
#
#   단독(서버 to 서버):  podman compose -f compose.db.yml up -d
#   한 대에 전부:        scripts/up.ps1
#
# 스키마는 hotdb-migrate(Flyway)가 db/migration 에서 만든다. 볼륨을 지우지 않고도
# 새 V 파일을 더하면 다음 기동 때 그 파일만 적용된다.
# ─────────────────────────────────────────────────────────────────────────────
name: hotdb

services:
  hotdb-pg:
    image: docker.io/timescale/timescaledb:2.29.2-pg17
    container_name: hotdb-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HOTDB_ADMIN_PASSWORD:-postgres}
      TZ: Asia/Seoul
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
      # 로컬 podman VM 이 2GiB 라 작게 잡는다. 실서버(32GB)는 timescaledb-tune 값으로 바꾼다
      - -c
      - shared_buffers=${HOTDB_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_worker_processes=24
      - -c
      - log_min_duration_statement=1000
      # ── CDC ─────────────────────────────────────────────────────────────
      # 소비자: 권역 서비스 4 + RFC Provider 1 = 슬롯 5. 여유를 둔다
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=16
      - -c
      - max_replication_slots=16
      # 멈춘 슬롯이 디스크를 채우지 않게 상한. 넘으면 슬롯 무효화 → 재동기화 (디스크 고갈보다 낫다)
      - -c
      - max_slot_wal_keep_size=10GB
      # 소비자가 적재에 밀려 응답이 늦어도 바로 끊지 않는다 (embedded-cdc 실측)
      - -c
      - wal_sender_timeout=5min
    # 59248~59347 은 Windows 예약 구간이라 피한다
    ports:
      - "${HOTDB_PUBLIC_PORT:-59433}:5432"
    volumes:
      - hotdb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotdb"]
      interval: 5s
      timeout: 5s
      retries: 30

  hotdb-migrate:
    build:
      context: ./app
      args: { MODULE: hotdb-migrate }
    image: localhost/hotdb/hotdb-migrate:local
    container_name: hotdb-migrate
    restart: "no"
    depends_on:
      hotdb-pg: { condition: service_healthy }
    environment:
      HOTDB_HOST: hotdb-pg
      HOTDB_PORT: 5432
      HOTDB_ADMIN_PASSWORD: ${HOTDB_ADMIN_PASSWORD:-postgres}
      HOTDB_MIGRATION_LOCATIONS: filesystem:/hotdb-db/migration
      JAVA_TOOL_OPTIONS: -Xmx128m
    volumes:
      - ./db:/hotdb-db:ro

  hotdb-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: hotdb-exporter
    restart: unless-stopped
    depends_on:
      hotdb-pg: { condition: service_healthy }
    environment:
      DATA_SOURCE_NAME: "postgresql://hotdb_monitor:hotdb_monitor@hotdb-pg:5432/hotdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries.yaml
    command:
      - --no-collector.stat_bgwriter
    volumes:
      - ./monitoring/exporter:/etc/pgexporter:ro
    ports:
      - "${HOTDB_EXPORTER_PORT:-59487}:9187"

volumes:
  hotdb-pgdata:
