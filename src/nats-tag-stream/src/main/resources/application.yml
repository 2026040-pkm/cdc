spring:
  application:
    name: nats-tag-stream
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:64080}

tag-stream:
  nats:
    # Aspire 를 다시 띄우면 포트와 비밀번호가 바뀐다. 대시보드(http://localhost:15147)의 nats 연결 문자열을
    # NATS_URL 로 넘긴다. 저장소에 비밀번호를 남기지 않으려고 기본값에는 인증을 넣지 않았다.
    # 호스트는 127.0.0.1 로 쓴다 — podman 이 IPv4 에만 바인드해서 localhost(::1 먼저)는 늦게 붙는다.
    url: ${NATS_URL:nats://127.0.0.1:4222}
    # Engine 이 워크플로우마다 1초에 한 번 태그 변경 묶음을 보내는 주제
    subject: ${NATS_SUBJECT:intersyslink.workflow.ot.lidar.all.tags}
  ws:
    path: /ws/tags
    # 느린 클라이언트 보호. 한 번 보내는 데 이 시간을 넘기거나 쌓인 양이 이만큼을 넘으면 그 세션만 끊는다.
    # 필터 없는 구독은 1초에 약 300KB 가 나간다.
    send-time-limit-ms: 5000
    buffer-size-limit-bytes: 4194304
    allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
