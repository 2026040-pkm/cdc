# ─────────────────────────────────────────────────────────────────────────────
# Target TimescaleDB — CDC 적재 대상 DB (PostgreSQL 17 + TimescaleDB 2.29)
#
# 이 스택이 embedded-cdc 와 다른 점은 여기 하나다 — 수신 측 엔진이 TimescaleDB 다.
# 잡는 표 구성(car · computer · grade · member · lidar 표 넷)은 embedded-cdc 와 같다.
# 원천(src/timescaledb)이 TimescaleDB 이므로 "같은 엔진으로 받을 때" 를 견주려는 것이다.
#
# 복제 설정은 여전히 필요 없다. cdc-service 가 일반 JDBC 로 UPSERT/DELETE 할 뿐이다.
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  emb-cdc-tsdb-net:
    name: emb-cdc-tsdb-net

services:
  target-postgres:
    image: timescale/timescaledb:2.29.2-pg17
    container_name: emb-cdc-tsdb-target-pg
    networks: [emb-cdc-tsdb-net]
    environment:
      POSTGRES_DB: targetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      # 사용 통계 외부 전송 끄기
      - -c
      - timescaledb.telemetry_level=off
      # podman VM 메모리가 2GiB 다. 이미지의 timescaledb-tune 이 잡는 값이 VM 이 아니라
      # 호스트 기준으로 커질 수 있어 여기서 못 박는다 (원천 스택과 같은 값).
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      # 느린 문장 기록. 적용 SQL 이 무거워지면 여기서 먼저 보인다.
      - -c
      - log_min_duration_statement=1000
    ports:
      - "60433:5432"
    volumes:
      - emb-tsdb-target-pgdata:/var/lib/postgresql/data
      - ./target/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d targetdb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  emb-tsdb-target-pgdata:
