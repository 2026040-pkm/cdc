# ─────────────────────────────────────────────────────────────────────────────
# OT LiDAR 필드 데이터 적재 · TimescaleDB 경보
#
# 임계값 근거 (발행기 util/mqtt-lidar-sim 의 기본값 · 필드 정의서 4.2/5.2):
#   - 장비 350대 (조립 210 · 선행의장 140) · 상태 1초/대 · 스캔(실적·산출물) 1분/대
#   - 상태 전이 ONLINE ↔ CALIBRATING · ONLINE → ERROR → OFFLINE. 대부분은 ONLINE 이다.
#   - 따라서 "3분간 메시지 0" 은 발신 수백 회를 건너뛴 것이고, "60초 무응답 장비" 는 60회를 건너뛴 것이다.
#
# **레코드 알갱이.** 여기서 "레코드" 는 MQTT 메시지가 아니라 EES 레코드(항목 배열)다.
# 항목은 초당 426건으로 고정이지만 그것이 레코드 몇 개로 묶이느냐는 발신 측 배치 설정이 정한다.
#   ISL Provider          레코드당 ~210항목 · 1~3초 간격  → 약 0.3~1 레코드/초
#   util/mqtt-ees-bridge  BATCH_MAX_WAIT_MS=1000         → 토픽마다 1 레코드/초 = 3 레코드/초
# 둘을 같은 자릿수로 맞춰 두었다. 레코드 수로 눈금을 잡은 것은 LidarKafkaLagHigh 하나뿐이고,
# 발신 측 배치 창을 줄이면 그 임계의 의미(밀린 시간)가 같이 줄어든다.
# (발행기를 --burst 로 돌리면 1분 주기 채널이 60초에 한 번 몰려 레코드/초가 더 들쭉날쭉하다.)
# ─────────────────────────────────────────────────────────────────────────────
groups:
  - name: lidar-ingest
    rules:
      # 소비자가 살아 있는데 메시지가 안 들어온다 — 발신 측(Aspire Kafka) 이 멈췄거나
      # Aspire 세션이 새로 떠서 Kafka 컨테이너가 바뀌었는데 tsdb-net 에 안 붙은 것이다.
      - alert: LidarIngestStalled
        expr: sum(rate(lidar_ingest_messages_total[3m])) == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "3분간 ot.lidar.* 메시지를 하나도 소비하지 못했다"
          description: "발신이 멈췄거나 lidar-ingest 가 Kafka(kafka:9093) 에 닿지 못한다. scripts/up 을 다시 돌려 새 Kafka 컨테이너를 tsdb-net 에 붙여라."

      # 소비자 지표 자체가 없다 — 컨테이너가 죽었다.
      - alert: LidarIngestDown
        expr: up{job="lidar-ingest"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "lidar-ingest 컨테이너가 응답하지 않는다"

      # 소비가 발신을 못 따라간다. 3 레코드/초 기준 200개 = 약 1분치가 5분 내내 이어진 것이다
      # (ISL 발신이면 같은 200개가 약 3~10분치다 — 위 '레코드 알갱이' 참고).
      - alert: LidarKafkaLagHigh
        expr: sum(lidar_ingest_kafka_lag) > 200
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Kafka 소비 지연이 {{ $value }} 레코드"
          description: "DB 쓰기가 느리거나(배치 시간 패널) 소비자가 재시작을 반복하고 있다. 밀린 시간으로 보려면 end-to-end 지연 패널을 같이 봐라."

      # 장비 발생 시각 → DB 커밋. 정상은 1초 미만이다.
      # 소비자를 새로 올려 밀린 것을 따라잡는 동안(earliest 부터) 은 오래된 이벤트가 들어오므로
      # 크게 나온다 — 그래서 10분을 기다린다. 따라잡은 뒤에도 크면 진짜 지연이다.
      - alert: LidarEndToEndLagHigh
        expr: histogram_quantile(0.95, sum(rate(lidar_ingest_end_to_end_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "end-to-end 지연 p95 가 {{ $value }}초"

      # 파싱 실패는 스키마가 바뀌었다는 신호다. 한 건이라도 나면 봐야 한다.
      - alert: LidarIngestRejects
        expr: increase(lidar_ingest_rejects_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "최근 10분간 격리된 항목 {{ $value }}건"
          description: "rdb.lidar_ingest_reject 표에서 원문과 사유를 확인하라. 발신 스키마가 바뀌었을 가능성이 크다."

      # 카탈로그에 없는 숫자 tid 가 들어왔다 — InterSysLink 에서 태그를 새로 등록했는데
      # rdb.lidar_tag_catalog 를 다시 내보내지 않은 것이다. 그 항목은 장비 축이 '#숫자' 로 남는다.
      # 적재는 계속되므로 critical 은 아니지만 대시보드의 장비 축이 조용히 망가진다.
      - alert: LidarTagUnresolved
        expr: increase(lidar_ingest_tag_unresolved_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "최근 10분간 카탈로그가 못 푼 태그 {{ $value }}건 ({{ $labels.channel }})"
          description: "python scripts/export-tag-catalog.py 로 03-tag-catalog.sql 을 다시 만들고 rdb.lidar_tag_catalog 를 갱신하라."

      # 태그 카탈로그가 비었다. 소비자가 기동할 때 표를 못 읽었거나 시드가 안 들어갔다.
      - alert: LidarTagCatalogEmpty
        expr: lidar_ingest_tag_catalog_rows == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "태그 카탈로그가 비어 있다 — 모든 장비 축이 '#숫자' 로 남는다"

      # 등록부의 채널과 실제 발행 토픽이 어긋난다 — EES 메시지 설정이 잘못됐다.
      - alert: LidarTagChannelMismatch
        expr: increase(lidar_ingest_tag_channel_mismatch_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "최근 10분간 카탈로그 채널과 토픽이 어긋난 항목 {{ $value }}건"
          description: "InterSysLink 의 EES 메시지(send_topic)와 태그 등록이 어긋났다. 실려 온 토픽을 믿고 적재했다."

      # DB 오류로 배치를 재시도 중이다. 소비는 멈추고 Kafka 지연이 쌓인다.
      - alert: LidarIngestDbErrors
        expr: increase(lidar_ingest_db_errors_total[5m]) > 3
        labels: {severity: critical}
        annotations:
          summary: "최근 5분간 DB 쓰기 오류 {{ $value }}회"

  - name: lidar-fleet
    rules:
      - alert: LidarDevicesError
        expr: tsdb_lidar_devices_count{status="ERROR"} > 10
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "ERROR 상태 장비 {{ $value }}대"
          description: "정상은 350대 중 한두 대다. 10대를 넘으면 개별 장비가 아니라 공통 원인(네트워크 E-NET-*)을 의심하라."

      # OFFLINE 은 ERROR 를 지나야 들어가는 종착 상태다. 하트비트가 멈추고 스캔 속도가 0 이 된다.
      # 여기 오래 머무는 장비는 사람이 가서 봐야 한다 — 스스로 복구될 확률이 낮다.
      - alert: LidarDevicesOffline
        expr: tsdb_lidar_devices_count{status="OFFLINE"} > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "OFFLINE 장비 {{ $value }}대가 10분 넘게 이어진다"

      - alert: LidarDevicesStale
        expr: tsdb_lidar_fleet_stale > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "60초 넘게 소식이 없는 장비 {{ $value }}대"

      # 전체가 멈추면 stale 보다 이 값이 먼저 커진다. LidarIngestStalled 와 짝.
      - alert: LidarDataStale
        expr: tsdb_lidar_fleet_freshness_seconds > 120
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "DB 의 최신 이벤트가 {{ $value }}초 전이다"

  - name: timescaledb
    rules:
      - alert: TimescaleDbDown
        expr: pg_up{job="timescaledb"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "TimescaleDB 에 exporter 가 붙지 못한다"

      # 압축·보존·집계 정책 중 하나가 마지막 실행에 실패했다.
      # 실패한 채 두면 디스크가 안 줄고 대시보드의 1분 집계가 멈춘다.
      - alert: TimescaleJobFailed
        expr: tsdb_job_last_run_ok == 0 and tsdb_job_total_runs > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "백그라운드 잡 {{ $labels.proc_name }} ({{ $labels.hypertable }}) 마지막 실행 실패"

      - alert: TimescaleJobFailingRepeatedly
        expr: increase(tsdb_job_total_failures[1h]) >= 3
        labels: {severity: critical}
        annotations:
          summary: "잡 {{ $labels.proc_name }} 이 1시간에 {{ $value }}번 실패"

      # 31일 보존이라 정상 상태에서도 한 달치(~20GB)가 쌓인다. 10% 남으면 경보.
      - alert: TimescaleDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"} < 0.10
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "도커 VM 디스크 여유 {{ $value | humanizePercentage }}"

      - alert: TimescaleConnectionsHigh
        expr: tsdb_db_connections > 80
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "DB 연결 {{ $value }}개 (max_connections 100)"

      # 캐시 적중률이 낮으면 shared_buffers 가 작거나 대시보드 SQL 이 오래된 청크를 훑고 있다.
      - alert: TimescaleCacheHitLow
        expr: |
          rate(pg_stat_database_blks_hit{datname="lidar"}[5m])
            / (rate(pg_stat_database_blks_hit{datname="lidar"}[5m]) + rate(pg_stat_database_blks_read{datname="lidar"}[5m])) < 0.90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "버퍼 캐시 적중률 {{ $value | humanizePercentage }}"
