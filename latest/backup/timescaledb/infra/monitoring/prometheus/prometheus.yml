global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 경보 규칙. 임계값의 근거는 규칙 파일 상단 주석 참고.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # lidar-ingest (Kafka → TimescaleDB 소비자) — 처리량, Kafka 지연, end-to-end 지연, 격리
  - job_name: lidar-ingest
    static_configs:
      - targets: ["lidar-ingest:8000"]

  # TimescaleDB — PostgreSQL 기본 지표 + 하이퍼테이블·압축·잡·장비 상태 집계
  - job_name: timescaledb
    static_configs:
      - targets: ["tsdb-exporter:9187"]

  # 도커 VM 디스크·메모리 — 청크 누적으로 디스크가 차는지 감시
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
