# MQTT Agent 검증용 브로커 3종 로컬 스택
#
#   mosquitto  : MQTT 표준 레퍼런스 (3.1.1 / 5.0, QoS 0/1/2)
#   emqx       : 운영 확장 기능 확인용 (3.1.1 / 5.0, QoS 0/1/2, Dashboard)
#   nats       : NATS Server 내장 MQTT 리스너 (3.1.1만, QoS 0/1, JetStream 필수)
#
# 세 브로커가 동시에 뜨므로 호스트 포트를 1883 / 1884 / 1885 로 분리했다.
# 컨테이너 내부는 전부 1883 이라, 컨테이너끼리는 <서비스명>:1883 으로 붙는다.
#
# 실행:  docker compose up -d           (podman:  podman compose up -d)
# 도구:  docker compose --profile tools up -d
# 시뮬:  docker compose --profile sim   up -d

name: mqtt-broker-lab

services:
  # ── Eclipse Mosquitto ───────────────────────────────────────────────
  # 순수 MQTT 전용 브로커. "표준 MQTT에서 동작하는가"의 기준선.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks: [mqttnet]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── EMQX ────────────────────────────────────────────────────────────
  # Dashboard: http://localhost:18083  (admin / public)
  emqx:
    image: emqx/emqx:5.8
    container_name: mqtt-emqx
    restart: unless-stopped
    ports:
      - "1884:1883"    # MQTT   (호스트 1884 → 컨테이너 1883)
      - "8083:8083"    # MQTT over WebSocket
      - "18083:18083"  # Dashboard
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_NODE__COOKIE: "mqtt-lab-cookie"
      # 익명 접속 허용 (로컬 검증 목적). 운영에서는 authenticator 설정 필요.
      EMQX_ALLOW_ANONYMOUS: "true"
      # 브로커 중립 검증을 위해 NATS 기본값(1MB)과 동일하게 맞춤
      EMQX_MQTT__MAX_PACKET_SIZE: "1MB"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "public"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks: [mqttnet]
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── NATS Server (MQTT 리스너 활성화) ────────────────────────────────
  # MQTT 리스너는 JetStream이 켜져 있어야만 동작한다. nats/nats.conf 참고.
  nats:
    # interSysLink(Aspire) 로컬 스택이 실제로 띄우는 이미지와 버전을 맞춤
    image: nats:2.14-alpine
    container_name: mqtt-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      # 주의: interSysLink(Aspire) 로컬 스택이 이미 4222/4223 을 점유하므로
      #       충돌을 피하려고 네이티브/모니터링 포트를 1xxxx 대로 올렸다.
      - "1885:1883"    # MQTT   (호스트 1885 → 컨테이너 1883)
      - "14222:4222"   # NATS 네이티브 클라이언트
      - "18222:8222"   # 모니터링 HTTP
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    networks: [mqttnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── mosquitto 클라이언트 컨테이너 (기본 기동) ───────────────────────
  # 왜 필요한가:
  #   - 호스트에 mosquitto_pub/sub 를 설치하지 않고도 pub/sub 검증이 된다.
  #   - 세 브로커가 같은 mqttnet 안에 있으므로 여기서는 호스트 포트 매핑
  #     (1883/1884/1885) 을 신경 쓸 필요 없이 전부 <서비스명>:1883 으로 붙는다.
  #     host.containers.internal 경유가 아니라서 포트/방화벽 문제와 무관하다.
  #   - Agent 가 발행한 메시지를 사람이 눈으로 확인하는 기준 도구다.
  #
  # 기동 방식 주의: 예전에는 profiles: [tools] 라서 `compose up -d` 만으로는
  # 뜨지 않았고, 그 상태로 `podman exec mqtt-cli ...` 를 하면
  #   Error: no container with name or ID "mqtt-cli" found
  # 가 났다. 검증 흐름에서 항상 필요한 컨테이너라 프로파일을 떼고 기본 기동한다.
  #
  #   podman exec mqtt-cli mosquitto_sub -h mosquitto -p 1883 -t '#' -v
  mqtt-cli:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-cli
    restart: unless-stopped
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks: [mqttnet]

  # ── 그 외 도구 컨테이너 (profile: tools) ────────────────────────────

  # NATS 네이티브 구독으로 topic ↔ subject 변환을 실측하는 용도.
  #   docker compose --profile tools exec nats-box nats sub -s nats://nats:4222 ">"
  nats-box:
    image: natsio/nats-box:latest
    container_name: mqtt-nats-box
    profiles: [tools]
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks: [mqttnet]

  # ── 장비 시뮬레이터 (profile: sim) ──────────────────────────────────
  # LIDAR heartbeat 를 주기 발행한다. 대상 브로커/토픽 구분자/스키마는 env 로 전환.
  publisher:
    image: python:3.12-alpine
    container_name: mqtt-publisher
    profiles: [sim]
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./publisher:/app:ro
    command: ["sh", "-c", "pip install --no-cache-dir --quiet paho-mqtt==2.1.0 && python -u publisher.py"]
    environment:
      BROKER_HOST: "mosquitto"      # mosquitto | emqx | nats
      BROKER_PORT: "1883"           # 컨테이너 내부는 세 브로커 모두 1883
      DEVICE_ID: "lidar-deviceid-01"
      ZONE: "fabrication"
      DEVICE_TYPE: "lidar"
      TOPIC_SEPARATOR: "slash"      # slash → ot/device/... | dot → ot.device....
      PAYLOAD_SCHEMA: "generic"     # generic({id,raw_payload}) | device(문서 08 5-2)
      INTERVAL_SEC: "5"
      QOS: "1"                      # QoS 2 는 NATS 미지원이므로 금지
      RETAIN: "true"
      CLEAN_SESSION: "false"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks: [mqttnet]

networks:
  mqttnet:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  emqx-data:
  emqx-log:
  nats-data:
