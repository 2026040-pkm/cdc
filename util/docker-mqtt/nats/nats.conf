# NATS Server - MQTT 리스너 활성화 설정
#
# 전제조건 2가지 (둘 중 하나라도 빠지면 MQTT 접속이 실패한다):
#   1) jetstream 블록 활성화  — MQTT 세션/QoS1 상태가 JetStream 스트림에 저장된다
#   2) mqtt 블록 추가         — NATS 는 MQTT 리스너가 기본 비활성 상태다
#
# 제약 (브로커 중립 설계 시 반드시 지킬 것):
#   - MQTT 3.1.1 만 지원 (5.0 속성 사용 불가: User Property / Content-Type 등)
#   - QoS 0 / 1 만 지원 (QoS 2 요청 시 접속 또는 발행이 거부됨)
#   - 공유 구독($share) / $SYS 토픽 없음

server_name: nats-mqtt-lab

port: 4222
http: 0.0.0.0:8222      # 모니터링/헬스체크 (/healthz, /varz)

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 1GB
}

mqtt {
  listen: "0.0.0.0:1883"

  # QoS 1 재전송 대기 시간
  ack_wait: "1m"

  # 미확인 상태로 유지할 수 있는 최대 QoS 1 메시지 수
  max_ack_pending: 1024
}

# NATS 네이티브 페이로드 상한 (기본 1MB). MQTT 로 들어온 메시지에도 동일 적용.
max_payload: 1MB
