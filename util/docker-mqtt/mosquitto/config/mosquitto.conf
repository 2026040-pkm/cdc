# Mosquitto 2.0 - MQTT Agent 로컬 검증용 설정
# 주의: 2.0 부터는 기본값이 "localhost 만 허용 + 익명 차단" 이므로
#       listener / allow_anonymous 를 명시하지 않으면 컨테이너 밖에서 붙을 수 없다.

# ── 리스너 ──────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# 로컬 검증 목적. 운영에서는 password_file / TLS 로 교체할 것.
allow_anonymous true

# ── 영속성 ──────────────────────────────────────────────
# Clean Session=false + QoS 1 재접속 시 미수신 메시지 복구를 검증하려면 필수
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ── 메시지 크기 ─────────────────────────────────────────
# 기본값은 0(무제한)이지만, EMQX(1MB)/NATS(1MB)와 조건을 맞춰
# "브로커를 바꾸면 갑자기 크기 제한에 걸리는" 상황을 로컬에서 미리 잡는다.
message_size_limit 1048576

# ── 로그 ────────────────────────────────────────────────
log_dest stdout
log_type all
connection_messages true
log_timestamp true
